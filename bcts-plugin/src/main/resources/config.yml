# 默认每公里价格
price-per-km: 0.2

# 创建 / 修改铁路系统时，允许设置的每公里价格范围（含边界）。
# 系统在配置向导中输入的 price-per-km 必须落在此区间内。
price-per-km-range:
  min: 0.0
  max: 10.0

# slowdown 减速控制牌预测 platform 的最大检测距离（block）。
# 列车经过 slowdown 控制牌时，向前预测寻找 platform 控制牌；超出此距离仍未找到则不减速，
# 防止玩家把 slowdown 放得过远导致的性能问题。
slowdown-max-detect-distance: 500.0

# 跨站车车票名（需要在tc插件新建，用于识别使用本车票系统的列车）
express-ticket-name: 'express'

# 可设置的最大/最小速度
speed:
  max: 5.0
  min: 2.0
  step: 0.2

# 车票使用次数相关信息
uses:
  max: 50
  discount:
    # 次数下限-次数上限-折扣
    - '5-10-0.7'
    - '11-25-0.6'
    - '26-50-0.5'

# 权限组的折扣，和上方的折扣叠加
perm-discount:
  displayname-全局管理员:
    - '1-50-0.0'
  bc-prefix-railways:
    - '1-50-0.7'
  bc-prefix-roadways:
    - '1-50-0.7'

# 交通卡
card:
  # 物品名
  name: '<gold><!italic>帕拉伦铁路交通卡'
  # 最大储蓄金额
  max-balance: 114514
  # 起步价
  base-fare: 0.5
  # 单次最大充值金额
  max-signle-charge: 1000

# 直达车（快速车）途中忽略的控制牌类型（按控制牌第二行关键字前缀匹配）。
# 直达车跨越中途站时，列在这里的控制牌不触发（被取消）；只有到达终点站时才放行、正常停车。
# 终点站的判断依据导航进度（列车走完全部道岔即视为到达终点区段），与控制牌是否写站名无关。
# 例：station 让直达车穿过只有停靠线的中途站不停车；announce 抑制中途站的进出站播报。
express-skip-signs:
  - "station"
  - "announce"
  - "sound"

# 购票搜索结果相关配置
search:
  # 显示「距离最近」的路线条数（<=0 不限制）
  max-distance-results: 5
  # 显示「票价最低」的路线条数（<=0 不限制）
  max-price-results: 5
  # 混合排序权重：把候选集内的距离、票价各归一化到 [0,1] 后，
  # weight = weight-distance * 归一化距离 + weight-price * 归一化票价，权重越小越靠前。
  weight-distance: 0.5
  weight-price: 0.5
  # 兜底：当混合排序结果里一条直达车票都没有（全是联程票）时，
  # 至少保留最优的这么多条直达车票（若确实存在直达方案）。<=0 表示不兜底。
  min-direct-results: 1
  # 最多显示的联程票（换乘）方案条数（<=0 不限制，但仍受下方候选上限约束）。
  max-transfer-results: 3
  # 换乘寻路时最多考察的候选换乘站数量。防止在站点很多的大型线路上，
  # 对每个候选站都做两段寻路而导致的组合爆炸卡顿。优先考察直达路径上的经停站。
  max-transfer-candidates: 30
  # 联程票（换乘）最低改善比例：仅当换乘总距离 < 最短直达距离 ×(1 - 此值) 时才显示联程票。
  # 例 0.2 表示换乘至少要比直达短 20% 才值得下车换乘，避免「直达也经过换乘站、几乎不省」的噪音。
  # 0 表示只要严格短于直达就显示；两站无直达时此门槛不生效（无条件给换乘）。
  transfer-min-improvement: 0.2

# 坐车凭证字体设置
font:
  # 字体名，从系统注册的字体寻找，留空则读取配置文件夹下的font-file，都留空使用默认字体
  name: ''
  font-file: ''
  size: 8.0
  bold: true

lore:
  # 公共占位符：
  # {start_station_name} {start_railway_name} {start_line_color} {start_railway_system}
  # {end_station_name} {end_railway_system}
  # {start_station_full} {end_station_full}  带色站名+(系统名)，站点为空显示N/A
  # {distance} {speed} {price}
  # {path_info_lore} {railway_info_lore} {distance_info_lore} 必须放在单独一行
  # ticket独有：
  # {max_uses} {owner_name}
  # distance_info_lore独有：
  # {railway_system} {system_distance} {system_price} {system_price_per_km}
  # card独有：
  # {balance} {use_platform}
  # ================== 车票lore相关 ==================
  ticket:
    - '<!italic><dark_purple>▶ 路线'
    - '<italic>{start_station_full} <gold>====直达====＞ {end_station_full}'
    - '<!italic><dark_purple>▶ 车票使用方法'
    - '<italic><gold>前往 {start_railway_system} <gold>的 {start_line_color}{start_station_name}站 , <gold>使用标有 {start_line_color}{start_railway_name} <gold>的发车装置发车, 主手拿本车票上车'
    - '<!italic><dark_purple>▶ 路线详情（只停起始站和终到站）'
    - '{path_info_lore}'
    - '<!italic><dark_purple>▶ 途经铁路'
    - '{railway_info_lore}'
    - '<!italic><light_purple>{distance} km | 最大速度 {speed} km/h'
    - '<italic><light_purple>手持车票右键可开启站台导航'
  # 这部分lore会在购买后移除
  ticket-price:
    - '<!italic><dark_gray>======================================'
    - '<!italic><dark_purple>▶ 各铁路系统收费详情(不含折扣)'
    - '{distance_info_lore}'
    - ''
    - '<!italic><light_purple>总价(含折扣)：{price}银币     点击购买'
  # 每行{distance_info_lore}的具体格式
  distance-info-lore: '<gold>{railway_system} <dark_aqua>{system_distance}km <aqua>{system_price}银币'

  # 联程票每段行程前的分隔行。
  # 占位符：{index} 当前行程序号(1开始) {total} 总行程数
  #   {leg_start_station} {leg_end_station} 本段行程的起点/终点站名
  through-ticket-separator: '<!italic><dark_gray>========= <gold>行程 {index} <gray>{leg_start_station}→{leg_end_station} <dark_gray>========='

  # ================== 交通卡lore相关 ==================
  card:
    - '<dark_purple><!italic>▶ 交通卡信息'
    - '<gold><!italic>余额：<italic><dark_aqua>{balance}</italic>'
    - '<gold><!italic>起始站：<italic>{start_station_full}</italic>'
    - '<gold><!italic>终到站：<italic>{end_station_full}</italic>'
    - '<gold><!italic>可用站台：<italic>{use_platform}</italic>'
  # 路线详情lore每行最多显示的车站数
  station-name-cnt-perrow: 7
  # 途经铁路lore每行最多显示的车站数
  railway-name-cnt-perrow: 4


# 普通车 bossbar 滚动站名带样式（直达车 bossbar 文案见 message.express-normal/express-end）
bossbar:
  # 已过站颜色（支持 #RRGGBB 十六进制或 legacy &-code）
  passed-color: '&7'
  # 未过站颜色（支持 #RRGGBB 或 legacy &-code）；留空则使用该线路 railway_routes.yml 中的 line-color
  not-passed-color: ''
  # 已过站最大显示个数
  passed-num: 2
  # 未过站最大显示个数
  not-passed-num: 3
  # 到站标题：使用 railway_routes.yml 中各线路的 bossbar-arrival-notice（占位符 {curr_station}），
  # 该线路留空则到站时显示滚动站名带（…上一站 → 当前站 → 下一站…）

# 「寻找上车站台」引导：玩家右键手中的车票，动作栏实时显示前往发车站台的方向与距离，
# 站台处显示粒子光柱 + 头顶全息站名。到达站台或切走手中车票时自动结束。
guide:
  # 引导总开关
  enabled: true
  # 到达判定：与站台的水平距离 <= 此值（格）即视为到达并结束引导
  arrive-distance: 3.0
  # 引导超时上限（秒），<=0 表示不超时
  timeout-seconds: 60
  # 引导刷新间隔（tick），越小越平滑但开销略高
  update-interval-ticks: 5
  # 是否显示目的地粒子光柱
  show-beacon: true
  # 是否显示站台头顶全息站名
  show-hologram: true
  # 全息站名文字大小倍率
  hologram-text-size: 1.8
  # 粒子光柱 / 全息文字高度（格）
  beacon-height: 5.0
  # 粒子光柱颜色（#RRGGBB），非法时回退金色。仅对 DUST 类粒子生效
  beacon-color: '#FFAA00'
  # 粒子光柱直径（格）。<=0 退化为一条居中竖线
  beacon-diameter: 0.6
  # 粒子类型（org.bukkit.Particle 枚举名，如 DUST / FLAME / END_ROD / HAPPY_VILLAGER），非法回退 DUST
  beacon-particle: 'DUST'
  # 光柱竖直方向相邻粒子层的间距（格），越小越密（下限 0.1）
  beacon-vertical-gap: 0.5
